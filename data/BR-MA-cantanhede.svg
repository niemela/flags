<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 600">
<defs> 
	<g id="star" transform="scale(120)"> 
		<g id="cone"> 
			<polygon id="triangle" fill="#FFFFFF" points="0,0 0,1 .5,1" transform="translate(0,-1) rotate(18)"/> 
			<use xlink:href="#triangle" transform="scale(-1,1)"/> 
		</g> 
		<use xlink:href="#cone" transform="rotate(72)"/> 
		<use xlink:href="#cone" transform="rotate(-72)"/> 
		<use xlink:href="#cone" transform="rotate(144)"/> 
		<use xlink:href="#cone" transform="rotate(-144)"/> 
	</g> 
</defs>
<rect fill="#FFF212" width="100%" height="100%" />
<path fill="#ED3237" d="M300,0 L 900,300 v300 L300,300zz" />
<path fill="#00A859" d="M300,0 L 900,0 v300z" />
<rect fill="#3E4095" width="300" height="300" />
<use xlink:href="#star" x="150" y="150" /> 
</svg>
