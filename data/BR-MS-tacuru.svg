<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="700">
	<defs>
		<g id="star" fill="#ffff00" transform="scale(100)">
			<g id="cone">
				<polygon id="triangle" points="0,0 0,1 .5,1" transform="translate(0,-1) rotate(18)"/>
				<use xlink:href="#triangle" transform="scale(-1,1)"/>
			</g>
			<use xlink:href="#cone" transform="rotate(72)"/>
			<use xlink:href="#cone" transform="rotate(-72)"/>
			<use xlink:href="#cone" transform="rotate(144)"/>
			<use xlink:href="#cone" transform="rotate(-144)"/>
		</g>
	</defs>
	<rect fill="#00afef" y="0" x="0" height="700" width="1000" />
	<path fill="#fff" d="M 0,0 L 900,700 1000,700 100,0 z " />
	<use xlink:href="#star" x="850" y="150" />
</svg>
