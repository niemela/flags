<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="600" height="400" viewBox="0 0 180 120">
<desc>Flag of Malé Svatoňovice (CZ)</desc>
<defs>
<g id="petal">
<path d="M0,0 c-2,-2 -4,-6 0,-6 c4,0 2,4 0,6z"/>
<path d="M-0.5,-4 L0,0 L0.5,-4" style="stroke:#000000;stroke-width:0.2px;"/>
</g>
<g id="flower" style="fill:#ffffff;stroke:#000000;stroke-width:0.45px" transform="scale(1.35)">
<use xlink:href="#petal" transform="rotate(72)"/>
<use xlink:href="#petal" transform="rotate(-72)"/>
<use xlink:href="#petal" transform="rotate(144)"/>
<use xlink:href="#petal" transform="rotate(-144)"/>
<use xlink:href="#petal" transform="rotate(0)"/>
<circle r="1"/>
</g>
<g id="hammer">
<g transform="rotate(-50) translate(0,-15)">
<path d="M1.5,0 l0.7,28 a2.2,1 0 0,1 -4.4,0 l0.7,-28z"/>
<path d="M6,0.2 l-0.1,5 a50,50 0 0,0 -11.8,0 l-0.1,-5 a50,50 0 0,1 12,0z"/>
</g>
<g transform="rotate(50) translate(0,-15)">
<path d="M1.5,0 l0.7,28 a2.2,1 0 0,1 -4.4,0 l0.7,-28z"/>
<path d="M0,2.2 a50,50 0 0,1 10.5,2 a50,50 0 0,1 -10.5,2 l-7,-0.2 v-3.6z"/>
</g>
</g>
</defs>
<rect height="30" width="180" fill="#ffd800"/>
<rect height="60" width="180" y="30" fill="#008000"/>
<rect height="30" width="180" y="90" fill="#0055ff"/>
<g transform="translate(90,61)">
<use xlink:href="#flower" transform="translate(0,-19)"/>
<g id="right">
<use xlink:href="#flower" transform="translate(15,-11)"/>
<use xlink:href="#flower" transform="translate(19,5.7)"/>
<use xlink:href="#flower" transform="translate(8.5,18.2)"/>
</g>
<use xlink:href="#right" transform="scale(-1,1)"/>
</g>
<g transform="translate(90,0)">
<use xlink:href="#hammer" transform="translate(-56,62) scale(-1,1)"/>
<use xlink:href="#hammer" transform="translate(56,62)"/>
</g>
</svg>


