<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="600" height="400" viewBox="0 0 6 4">
<desc>Flag of Rudník (CZ)</desc>
<defs>
<g id="s">
	<g id="c">
		<polyline id="t" fill="#ffd500" points="0,0 0,0.25 0.25,0.25" transform="translate(0,-0.25) rotate(30)"/>
		<use xlink:href="#t" transform="scale(-1,1)"/>
	</g>
		<use xlink:href="#c" transform="rotate(60)"/>
		<use xlink:href="#c" transform="rotate(-60)"/>
		<use xlink:href="#c" transform="rotate(120)"/>
		<use xlink:href="#c" transform="rotate(-120)"/>
		<use xlink:href="#c" transform="rotate(180)"/>
</g>
</defs>
	<polygon points="0,0 6,0 6,4 0,4" fill="#f00"/>
	<polygon points="0,2 6,2 6,4 0,4" fill="#fff"/>
	<use xlink:href="#s" transform="translate(1,1)"/>
	<use xlink:href="#s" transform="translate(2,1)"/>
	<use xlink:href="#s" transform="translate(3,1)"/>
	<use xlink:href="#s" transform="translate(4,1)"/>
	<use xlink:href="#s" transform="translate(5,1)"/>
</svg>
