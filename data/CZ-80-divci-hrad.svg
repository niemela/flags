	</g>
</defs>
<rect height="400" width="600" fill="#C52A54" />
<path d="M0,300 h25 v-50 h50 v50 h50 v-50 h50 v50 h50 v-50 h50 v50 h50 v-50 h50 v50 h50 v-50 h50 v50 h50 v-50 h50 v50 h25 v100 h-600 z" fill="#F9F000" />
