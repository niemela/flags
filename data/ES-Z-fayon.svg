        <dc:description>Se trata de un paño dividido por dos rectas que, partiendo del centro, van al centro del asta; la parte de asta, de rojo, con un conjunto en el centro de cuatro losanjes, dispuestos uno-dos-uno de amarillo. Parte del batiente, de amarillo, con el mismo conjunto de rombos, igualmente centrados, de rojo </dc:description>
